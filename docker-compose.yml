services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: RevendTout
    volumes:
      - logistiquedb:/var/lib/postgresql/
      - ./initdb.d:/docker-entrypoint-initdb.d
    networks:
      - logistique-net
    ports:
      - 5555:5432

  api:
    # build:
    #   dockerfile: ./LogistiqueGestion.API/Dockerfile
    #   context: .
    image: registry.gitlab-formation.2isa.eu/mmougeo/cda11-mougeot_marylene-fr-jalon_2_logistiquegestionapi
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionDB=Server=db;database=RevendTout;uid=postgres;Pwd=password;Port=5432
      - TypeDB=POSTGRESQL
    networks:
      - logistique-net
    depends_on:
      - db

volumes:
  logistiquedb:

networks:
  logistique-net: