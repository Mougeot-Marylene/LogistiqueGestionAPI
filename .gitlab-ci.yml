
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /feature/
      when: never
    - if: $CI_COMMIT_BRANCH =~ /projet_global/
  
default:
   services:
     - postgres

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "unix:///runner/services/docker/docker.sock"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest  
  POSTGRES_DB: LogistiqueGestionTEST
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_HOST_AUTH_METHOD: trust
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  ConnectionDB: "Server=postgres;Port=5432;Database=LogistiqueGestionTEST;User Id=postgres;Password=password;"
  TypeDB: "POSTGRESQL"

image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - test
  - build-sonar
  - deploy

build-job:
  stage: build
  
  script:
    - dotnet restore LogistiqueGestion.API/LogistiqueGestion.API.csproj
    - dotnet build LogistiqueGestion.API/LogistiqueGestion.API.csproj -c Release

test-job:
  stage: test
  script:

    - dotnet test

build-sonar:
  stage: build-sonar
  
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
      
  script: 
      - "dotnet tool install --global dotnet-sonarscanner"
      - "export PATH=\"$PATH:$HOME/.dotnet/tools\""
      - "dotnet sonarscanner begin /k:\"mmougeo_cda11-mougeot_marylene-fr-jalon_2_logistiquegestionapi_71e46314-f742-4500-b203-e484ed029769\" /d:sonar.token=\"$SONAR_TOKEN\" /d:\"sonar.host.url=$SONAR_HOST_URL\" "
      - "dotnet build"
      - "dotnet sonarscanner end /d:sonar.token=\"$SONAR_TOKEN\""
  allow_failure: true

docker-build:
  stage: deploy
  image: quay.io/buildah/stable
  variables:
    # Use vfs with buildah. Docker offers overlayfs as a default, but Buildah
    # cannot stack overlayfs on top of another overlayfs filesystem.
    STORAGE_DRIVER: vfs
    # Write all image metadata in the docker format, not the standard OCI format.
    # Newer versions of docker can handle the OCI format, but older versions, like
    # the one shipped with Fedora 30, cannot handle the format.
    BUILDAH_FORMAT: docker
    FQ_IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  #   - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah images
    - buildah build -t $FQ_IMAGE_NAME -f LogistiqueGestion.API/Dockerfile .
    - buildah images
    - buildah push $FQ_IMAGE_NAME


  